<!DOCTYPE html>
<html data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1f18">
<title>Chaico</title>
<link rel="stylesheet" href="style.css">
<style>
  /* Small mobile-specific tweaks on top of the original desktop stylesheet */
  html, body { height: 100%; overscroll-behavior: none; }
  #shell { display: flex; flex-direction: column-reverse; }
  #sidebar { width: 100% !important; flex-direction: row !important; align-items: center; padding: 6px 8px !important; overflow-x: auto; }
  #sidebar .logo { display: none !important; }
  #sidebar .theme-toggle { display: none !important; }
  #navSide { display: flex !important; flex-direction: row !important; gap: 4px; width: 100%; }
  #navSide button { flex-direction: column !important; font-size: 11px !important; padding: 6px 4px !important; gap: 2px !important; }
  #navSide button .ic { font-size: 18px; }
  #main { padding-bottom: 90px !important; -webkit-overflow-scrolling: touch; }
  .item-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)) !important; }
</style>
</head>
<body>
  <div id="shell">
    <aside id="sidebar">
      <div class="logo">
        <div class="mark">C</div>
        <div class="txt"><h1>Chaico</h1><span>Canteen Manager</span></div>
      </div>
      <nav class="side" id="navSide"></nav>
      <div class="theme-toggle">
        <span id="themeLabel">Light Mode</span>
        <div class="switch" id="themeSwitch"><div class="knob"></div></div>
      </div>
    </aside>
    <main id="main"></main>
  </div>

  <script src="vendor/sql-wasm.js"></script>
  <script src="vendor/chart.umd.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
